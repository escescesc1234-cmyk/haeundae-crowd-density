<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Safe Flow · 실시간 모니터</title>
  <link rel="stylesheet" href="/waveguard.css" />
  <script src="/density-api-client.js"></script>
  <style>
    .rt-wrap { padding: 16px; max-width: 720px; margin: 0 auto; }
    .rt-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 12px 0;
    }
    .rt-stat {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .rt-stat b { display: block; font-size: 1.4rem; color: #1f6fe5; }
    .rt-stat span { font-size: .75rem; color: #666; }
    .sf-video-9x16 {
      position: relative;
      width: min(100%, 420px);
      margin: 0 auto;
      aspect-ratio: 9 / 16;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
    }
    .sf-video-9x16__media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: #111;
    }
    .rt-msg { margin: 10px 0; padding: 10px 12px; border-radius: 10px; font-size: .9rem; }
    .rt-msg.ok { background: #e8f7ee; color: #146c2e; }
    .rt-msg.warn { background: #fff4e5; color: #9a5b00; }
    .rt-msg.err { background: #fdecea; color: #b42318; }
    .rt-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .rt-actions a, .rt-actions button {
      background: #1f6fe5; color: #fff; border: 0; border-radius: 10px;
      padding: 10px 14px; text-decoration: none; font-size: .9rem; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <span class="logo">Safe Flow</span>
      <a class="gear" href="/">홈</a>
    </header>
    <div class="rt-wrap">
      <h2 style="margin:0 0 4px">실시간 AI 모니터</h2>
      <p style="margin:0;color:#666;font-size:.9rem">
        SAHI-256 · 9:16 contain · 부분 탐지 OK · /api/vision/realtime/monitor
      </p>
      <div id="banner" class="rt-msg warn">연결 확인 중…</div>
      <div class="rt-stats">
        <div class="rt-stat"><b id="est">-</b><span>추정 인원</span></div>
        <div class="rt-stat"><b id="sahi">-</b><span>SAHI person</span></div>
        <div class="rt-stat"><b id="fast">-</b><span>FAST person</span></div>
      </div>
      <div class="sf-video-9x16">
        <img id="stream" class="sf-video-9x16__media" alt="SAHI realtime" />
      </div>
      <p id="alert" class="rt-msg" style="display:none"></p>
      <div class="rt-actions">
        <a href="/admin.html">관리자</a>
        <a href="/tourist.html">관광객</a>
        <button type="button" id="btnReload">새로고침</button>
      </div>
    </div>
  </div>
  <script>
    const client = window.DensityApi.create({ baseUrl: "" });
    const banner = document.getElementById("banner");
    const stream = document.getElementById("stream");
    const alertEl = document.getElementById("alert");
    let poll = null;
    let lastStream = "";

    function setBanner(cls, text) {
      banner.className = "rt-msg " + cls;
      banner.textContent = text;
    }

    function applyMonitor(m) {
      if (!m || m.ok === false) {
        setBanner("err", (m && m.error) || "모니터 실패 — vision:realtime 확인");
        return;
      }
      const mon = m.monitoring || {};
      document.getElementById("est").textContent = mon.estimatedTotal ?? "-";
      document.getElementById("sahi").textContent = mon.sahiPersonCount ?? "-";
      document.getElementById("fast").textContent = mon.fastPersonCount ?? "-";

      const url = m.streamUrl || m.streamSahi256Url || "";
      if (url && url !== lastStream) {
        lastStream = url;
        stream.src = url + (url.includes("?") ? "&" : "?") + "t=" + Date.now();
      }

      const a = m.alerts || {};
      if (a.hasDanger && (a.managerMessage || a.touristMessage)) {
        alertEl.style.display = "block";
        alertEl.className = "rt-msg err";
        alertEl.textContent = a.managerMessage || a.touristMessage;
      } else {
        alertEl.style.display = "none";
      }

      if (m.phase === "warming") {
        setBanner("warn", "SAHI 워밍업 중… 부분 탐지여도 숫자 표시 (" + (mon.sahiState || "") + ")");
      } else if (m.phase === "error") {
        setBanner("err", "SAHI 오류 — FAST 숫자는 계속 표시");
      } else {
        setBanner(
          "ok",
          "실시간 모니터 · phase=" + (m.phase || "live") +
            " · 부분탐지 OK · dens=" + Number(mon.maxGridDensityPerM2 || 0).toFixed(2),
        );
      }
    }

    function boot() {
      if (poll) poll.stop();
      poll = client.startRealtimePolling(applyMonitor, {
        intervalMs: 2000,
        onError: function (err) {
          setBanner(
            "err",
            (err && err.message) ||
              "밀도 분석 서비스 연결 실패 — npm run dev + npm run vision:realtime",
          );
        },
      });
    }

    document.getElementById("btnReload").onclick = boot;
    boot();
  </script>
</body>
</html>
